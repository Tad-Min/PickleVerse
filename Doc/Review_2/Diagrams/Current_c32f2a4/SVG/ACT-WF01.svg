<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1615" viewBox="0 0 1400 1615">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="none" stroke="#556477" stroke-width="1.4"/></marker></defs>
<rect width="1400" height="1615" fill="white"/>
<text x="40" y="48" font-family="Arial" font-weight="bold" font-size="30">ACT-WF01  WF01 Register learn and complete a first drill</text>
<text x="40" y="78" font-family="Arial" font-size="20" fill="#546174">Owner slot M1 is proposed, not a named commitment. Actors are identified in the trigger; API/service</text>
<text x="40" y="101" font-family="Arial" font-size="20" fill="#546174">responsibilities are internal.</text>
<path d="M680.0,255 V285.0 H680.0 V315" fill="none" stroke="#7a8795" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M680.0,430 V457.5 H680.0 V485" fill="none" stroke="#7a8795" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M680.0,600 V627.5 H680.0 V655" fill="none" stroke="#7a8795" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M680.0,770 V797.5 H680.0 V825" fill="none" stroke="#7a8795" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M680.0,940 V967.5 H680.0 V995" fill="none" stroke="#7a8795" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M680.0,1110 V1137.5 H680.0 V1165" fill="none" stroke="#7a8795" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="1288" y="597.5" font-family="Arial" font-size="20" fill="#546174">Failure</text>
<text x="1288" y="622.5" font-family="Arial" font-size="20" fill="#546174">or invalid</text>
<text x="1288" y="647.5" font-family="Arial" font-size="20" fill="#546174">request</text>
<path d="M1180,542.5 H1270 V1430.0 H1180" fill="none" stroke="#7a8795" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="180" y="145" width="1000" height="110" rx="10" fill="#f6f9fd" stroke="#344c68" stroke-width="2"/>
<text x="202" y="183" font-family="Arial" font-weight="bold" font-size="24" fill="#132b47">Trigger</text>
<text x="202" y="212" font-family="Arial" font-size="23" fill="#222c39">Actor: Player, SMTP delivery service</text>
<rect x="180" y="315" width="1000" height="115" rx="10" fill="#f6f9fd" stroke="#344c68" stroke-width="2"/>
<text x="202" y="353" font-family="Arial" font-weight="bold" font-size="24" fill="#132b47">1 Submit and verify account</text>
<text x="202" y="382" font-family="Arial" font-size="23" fill="#222c39">Responsibility: Player, account API and SMTP</text>
<rect x="180" y="485" width="1000" height="115" rx="10" fill="#f6f9fd" stroke="#344c68" stroke-width="2"/>
<text x="202" y="523" font-family="Arial" font-weight="bold" font-size="24" fill="#132b47">2 Open tutorial and perform controls</text>
<text x="202" y="552" font-family="Arial" font-size="23" fill="#222c39">Responsibility: Player and Unity tutorial</text>
<rect x="180" y="655" width="1000" height="115" rx="10" fill="#f6f9fd" stroke="#344c68" stroke-width="2"/>
<text x="202" y="693" font-family="Arial" font-weight="bold" font-size="24" fill="#132b47">3 Choose an unlocked drill</text>
<text x="202" y="722" font-family="Arial" font-size="23" fill="#222c39">Responsibility: Player and catalog API</text>
<rect x="180" y="825" width="1000" height="115" rx="10" fill="#f6f9fd" stroke="#344c68" stroke-width="2"/>
<text x="202" y="863" font-family="Arial" font-weight="bold" font-size="24" fill="#132b47">4 Start server attempt and submit measurements</text>
<text x="202" y="892" font-family="Arial" font-size="23" fill="#222c39">Responsibility: Unity trial telemetry and Game API</text>
<rect x="180" y="995" width="1000" height="115" rx="10" fill="#f6f9fd" stroke="#344c68" stroke-width="2"/>
<text x="202" y="1033" font-family="Arial" font-weight="bold" font-size="24" fill="#132b47">5 Complete and refresh stars and first reward</text>
<text x="202" y="1062" font-family="Arial" font-size="23" fill="#222c39">Responsibility: Game API transaction and Unity refresh</text>
<rect x="180" y="1165" width="1000" height="130" rx="10" fill="#f6f9fd" stroke="#344c68" stroke-width="2"/>
<text x="202" y="1203" font-family="Arial" font-weight="bold" font-size="24" fill="#132b47">Business outcome</text>
<text x="202" y="1232" font-family="Arial" font-size="23" fill="#222c39">A verified player completes a first drill and sees the persisted result.</text>
<rect x="180" y="1335" width="1000" height="190" rx="10" fill="#f6f9fd" stroke="#344c68" stroke-width="2"/>
<text x="202" y="1373" font-family="Arial" font-weight="bold" font-size="24" fill="#132b47">Exception path</text>
<text x="202" y="1402" font-family="Arial" font-size="23" fill="#222c39">Expired OTP or invalid trial data is rejected; account/attempt can be retried</text>
<text x="202" y="1431" font-family="Arial" font-size="23" fill="#222c39">without duplicate reward.</text>
<text x="202" y="1460" font-family="Arial" font-size="23" fill="#222c39">Reject mutation; preserve state; show retry or policy outcome.</text>
</svg>