<rect width="1400" height="1615" fill="white"/>
<text x="40" y="48" font-family="Arial" font-weight="bold" font-size="30">ACT-WF06  WF06 Administer users content and operations</text>
<text x="40" y="78" font-family="Arial" font-size="20" fill="#546174">Owner slot M4 is proposed, not a named commitment. Actors are identified in the trigger; API/service</text>
<text x="40" y="101" font-family="Arial" font-size="20" fill="#546174">responsibilities are internal.</text>
