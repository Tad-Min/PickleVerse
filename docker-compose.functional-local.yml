# Local acceptance only. Linux deployment uses its own release-pinned compose files.
services:
  postgres:
    environment:
      PGOPTIONS: "-c pickleverse.seed_coaching_demo=on"
  backend-api:
    environment:
      DedicatedServer__Enabled: "true"
      DedicatedServer__ServiceKey: "${PKV_GAME_SERVER_KEY:?Set PKV_GAME_SERVER_KEY in the ignored .env file}"
      DedicatedServer__Protocol: "22"
      DedicatedServer__MaxConcurrentMatches: "${PKV_GAME_REPLICAS:-1}"
      DedicatedServer__LeaseSeconds: "45"
      HybridAi__IngestEnabled: "true"
      HybridAi__DispatcherEnabled: "true"
      HybridAi__CoachingEnabled: "true"
      HybridAi__ModelEnabled: "false"
  game-server:
    profiles: [dedicated]
    image: "${PKV_GAME_SERVER_IMAGE:-pickleverse-game-server:local}"
    scale: ${PKV_GAME_REPLICAS:-1}
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    cpus: ${PKV_GAME_CPUS:-2}
    mem_limit: ${PKV_GAME_MEMORY:-2g}
    environment:
      PKV_BACKEND_URL: http://backend-api:8080
      PKV_GAME_SERVER_KEY: "${PKV_GAME_SERVER_KEY:?Set PKV_GAME_SERVER_KEY in the ignored .env file}"
      PKV_GAME_PORT: "3669"
    ports:
      - "127.0.0.1:${PKV_GAME_UDP_RANGE:-3669-4168}:3669/udp"
    volumes:
      - /home/unity/.config/unity3d
    depends_on:
      backend-api:
        condition: service_started
    networks: [pickleverse_network]
  ai-service:
    environment:
      AI_ENABLE_MODEL: "false"
      AI_COACHING_CALIBRATION_SHA256: ""
