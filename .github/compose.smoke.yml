# Disposable CI stack. No fixed container names, database ports or external volumes.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: ci-postgres-only
      POSTGRES_DB: pickleverse
    volumes:
      - ../src/Database.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sa -d pickleverse && psql -U sa -d pickleverse -tAc 'SELECT count(*) FROM users' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  s3-storage:
    image: ghcr.io/shyim/local-s3:latest
    environment:
      S3_ACCOUNT_ADMIN: minioadmin:minioadmin
  backend-api:
    image: ${CI_IMAGE_REPOSITORY:-tadminm/pickelverse}:api-${CI_RELEASE:?Set CI_RELEASE}
    restart: on-failure:3
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Database=pickleverse;Username=sa;Password=ci-postgres-only;GSS Encryption Mode=Disable
      Redis__ConnectionString: redis:6379,abortConnect=false
      Storage__ServiceUrl: http://s3-storage:9000
      Storage__AccessKey: minioadmin
      Storage__SecretKey: minioadmin
      Storage__BucketName: pickleverse-ci
      Jwt__Key: ci-jwt-only-key-at-least-32-characters-long
      Smtp__Username: ''
      Smtp__Password: ''
      Smtp__FromEmail: ''
      HybridAi__IngestEnabled: 'false'
      HybridAi__DispatcherEnabled: 'false'
      HybridAi__CoachingEnabled: 'false'
      HybridAi__ModelEnabled: 'false'
      DedicatedServer__Enabled: 'true'
      DedicatedServer__ServiceKey: ci-worker-only-key-at-least-32-characters
      DedicatedServer__Protocol: '18'
    ports: ['127.0.0.1::8080']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3-storage:
        condition: service_started
  ai-service:
    image: ${CI_IMAGE_REPOSITORY:-tadminm/pickelverse}:ai-${CI_RELEASE:?Set CI_RELEASE}
    environment:
      AI_SERVICE_KEY: ci-ai-only-key-at-least-32-characters-long
      AI_ENABLE_MODEL: 'false'
  web:
    image: ${CI_IMAGE_REPOSITORY:-tadminm/pickelverse}:web-${CI_RELEASE:?Set CI_RELEASE}
    environment:
      API_UPSTREAM: http://backend-api:8080
    ports: ['127.0.0.1::80']
    depends_on: [backend-api]
  game-server:
    image: ${CI_IMAGE_REPOSITORY:-tadminm/pickelverse}:server-${CI_RELEASE:?Set CI_RELEASE}
    environment:
      PKV_BACKEND_URL: http://backend-api:8080
      PKV_GAME_SERVER_KEY: ci-worker-only-key-at-least-32-characters
    depends_on: [backend-api]
