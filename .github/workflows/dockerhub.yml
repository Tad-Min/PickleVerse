name: Build, publish and deploy PickleVerse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified release to Linux development
        type: boolean
        default: false

permissions:
  contents: read

env:
  PKV_DOCKER_REPOSITORY: tadminm/pickelverse
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'tadminm' }}

jobs:
  validate:
    name: Validate .NET, FastAPI and admin web
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sa
          POSTGRES_DB: pickleverse
          POSTGRES_PASSWORD: ci-only-postgres
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U sa -d pickleverse"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            contracts
            My project/Assets/Scripts
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/AiService/requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Frontend/package-lock.json
      - name: Backend integration checks
        env:
          PKV_TEST_POSTGRES: Host=127.0.0.1;Port=15432;Database=pickleverse;Username=sa;Password=ci-only-postgres;GSS Encryption Mode=Disable;Maximum Pool Size=40
          PKV_TEST_REDIS: 127.0.0.1:16379,abortConnect=false
        run: |
          set -euo pipefail
          dotnet build src/Testing/Backend/IntegrationChecks.csproj --configuration Release
          for check in client-security api-contract schema status-enums content training-sync progress-reset moderation analytics expert-review dedicated hybrid; do
            dotnet run --project src/Testing/Backend --configuration Release --no-build -- "--check-$check"
          done
      - name: FastAPI tests
        working-directory: src/AiService
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Admin web type check
        working-directory: src/Frontend
        run: |
          npm ci
          npm run type-check

  native:
    name: Build Unity Linux Dedicated Server
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # The Linux Editor cannot import the client-only H.264 artwork.
          sparse-checkout: |
            /*
            !/My project/Assets/FrontEndContent/Login/Playback/Login.mp4
            !/My project/Assets/FrontEndContent/Login/Playback/Login.mp4.meta
            !/My project/Assets/FrontEndContent/Loading/Artwork/Playback/PKV_*.mp4
            !/My project/Assets/FrontEndContent/Loading/Artwork/Playback/PKV_*.mp4.meta
          sparse-checkout-cone-mode: false
      - name: Verify license configuration and resolve exact Unity image
        id: editor
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          set -euo pipefail
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]] || [[ -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ]] || [[ -n "$UNITY_LICENSE" && -n "$UNITY_SERIAL" ]]; then
            echo 'Configure UNITY_EMAIL, UNITY_PASSWORD and exactly one of UNITY_LICENSE or UNITY_SERIAL.' >&2
            exit 1
          fi
          version=$(sed -n 's/^m_EditorVersion: \([^[:space:]]*\).*/\1/p' 'My project/ProjectSettings/ProjectVersion.txt')
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+[abfp][0-9]+$ ]]
          tag="unityci/editor:ubuntu-$version-linux-il2cpp-3.2.2"
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | jq -er 'select(test("^sha256:[0-9a-f]{64}$"))')
          printf 'image=unityci/editor@%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Build native Dedicated payload
        # v5.0.1 supports the shared memory size required by this Unity build.
        uses: game-ci/unity-builder@adaf7cd8f42fd48fbbf2d4f5f67ca30d87f819f1 # v5.0.1
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: My project
          unityVersion: auto
          targetPlatform: StandaloneLinux64
          customImage: ${{ steps.editor.outputs.image }}
          buildMethod: PickleVerse.EditorTools.DedicatedServerCiBuild.BuildFromCi
          buildName: PickleVerseServer
          buildsPath: artifacts/ci/unity
          customParameters: -pkvCommit ${{ github.sha }} -standaloneBuildSubtarget Server
          dockerShmSize: 8g
          versioning: None
      - name: Verify and package the native output
        run: |
          set -euo pipefail
          mapfile -t outputs < <(find artifacts/ci/unity -type f -name build-info.json)
          [[ ${#outputs[@]} -eq 1 ]]
          native=$(dirname "${outputs[0]}")
          python3 deploy/ci/verify-native.py "$native" "$GITHUB_SHA"
          tar --exclude='*_BackUpThisFolder_ButDontShipItWithYourGame' -czf "$RUNNER_TEMP/native.tar.gz" -C "$native" .
          (cd "$RUNNER_TEMP" && sha256sum native.tar.gz > native.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native.tar.gz
            ${{ runner.temp }}/native.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  publish:
    name: Publish four release images and smoke test
    needs: [validate, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            deploy
            src
            My project/ProjectSettings
            My project/Assets/Scripts/Multiplayer/Services
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-${{ github.sha }}
          path: ${{ runner.temp }}/pkv-native
      - name: Verify and extract native artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci/dedicatedserver
          (cd "$RUNNER_TEMP/pkv-native" && sha256sum --check native.sha256)
          tar -xzf "$RUNNER_TEMP/pkv-native/native.tar.gz" -C artifacts/ci/dedicatedserver
          python3 deploy/ci/verify-native.py artifacts/ci/dedicatedserver "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build, push and smoke test the release
        id: release
        run: bash deploy/ci/publish-release.sh

  deploy:
    name: Deploy Linux development
    needs: publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: development
    concurrency:
      group: pickleverse-linux-development
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /deploy/ci/
            /docker-compose.linux.yml
            /src/Database.sql
          sparse-checkout-cone-mode: false
      - name: Install SSH password transport
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends sshpass
      - name: Sync deployment files and run Compose over SSH
        env:
          GH_TOKEN: ${{ github.token }}
          PKV_RELEASE: ${{ needs.publish.outputs.release }}
          PKV_DEPLOY_ROOT: ${{ vars.PKV_DEPLOY_ROOT || vars.PKV_DATA_ROOT }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER || 'min' }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash deploy/ci/ssh-deploy.sh
