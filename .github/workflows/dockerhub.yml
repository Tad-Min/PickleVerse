name: Build, publish and deploy PickleVerse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: Rebuild all four images and run all checks
        type: boolean
        default: false
      deploy:
        description: Deploy the verified release to Linux development
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pickleverse-workflow-${{ github.ref }}
  cancel-in-progress: false

env:
  PKV_DOCKER_REPOSITORY: tadminm/pickelverse
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'tadminm' }}

jobs:
  deployed:
    name: Read last successful Linux deployment
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (!inputs.full_rebuild || inputs.deploy)))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: development
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy/ci
      - name: Install SSH password transport
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends sshpass
      - name: Read deployment metadata over SSH
        env:
          PKV_DEPLOY_ROOT: ${{ vars.PKV_DEPLOY_ROOT || vars.PKV_DATA_ROOT }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER || 'min' }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          bash deploy/ci/read-deployment-state.sh | jq -ce '
            select(type == "object")
            | {token, pending, release: (.release | if . == null then null else {commit, protocol, images: (.images | {api, ai, web, server})} end)}
          ' > "$RUNNER_TEMP/deployment-state.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-state
          path: ${{ runner.temp }}/deployment-state.json
          if-no-files-found: error
          overwrite: true

  plan:
    name: Plan affected builds and checks
    needs: deployed
    if: >-
      ${{ !cancelled() && (github.event_name == 'pull_request' || needs.deployed.result == 'success' ||
          (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' &&
           inputs.full_rebuild && !inputs.deploy && needs.deployed.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.plan.outputs.build }}
      test_api: ${{ steps.plan.outputs.test_api }}
      test_ai: ${{ steps.plan.outputs.test_ai }}
      test_web: ${{ steps.plan.outputs.test_web }}
      native: ${{ steps.plan.outputs.native }}
      release: ${{ steps.plan.outputs.release }}
      images: ${{ steps.plan.outputs.images }}
      protocol: ${{ steps.plan.outputs.protocol }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # Sparse checkout also fetches history without downloading every blob.
          sparse-checkout: |
            /deploy/ci/
            /My project/Assets/Scripts/Multiplayer/Services/MultiplayerSceneConfiguration.cs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.deployed.result == 'success'
        with:
          name: deployment-state
          path: ${{ runner.temp }}
      - name: Compare the PR or deployed baseline
        id: plan
        env:
          PKV_PR_BASE: ${{ github.event.pull_request.base.sha }}
          PKV_DEPLOY_STATE_FILE: ${{ needs.deployed.result == 'success' && format('{0}/deployment-state.json', runner.temp) || '' }}
          PKV_FULL_REBUILD: ${{ inputs.full_rebuild }}
        run: python3 deploy/ci/plan-release.py

  backend:
    name: Backend integration checks
    needs: plan
    if: needs.plan.outputs.test_api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sa
          POSTGRES_DB: pickleverse
          POSTGRES_PASSWORD: ci-only-postgres
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U sa -d pickleverse"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            contracts
            My project/Assets/Scripts
            My project/Assets/Resources/BackendApiSettings.asset
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Backend integration checks
        env:
          PKV_TEST_POSTGRES: Host=127.0.0.1;Port=15432;Database=pickleverse;Username=sa;Password=ci-only-postgres;GSS Encryption Mode=Disable;Maximum Pool Size=40
          PKV_TEST_REDIS: 127.0.0.1:16379,abortConnect=false
        run: |
          set -euo pipefail
          dotnet build src/Testing/Backend/IntegrationChecks.csproj --configuration Release
          for check in client-security api-contract schema status-enums content training-sync progress-reset moderation analytics expert-review dedicated hybrid; do
            dotnet run --project src/Testing/Backend --configuration Release --no-build -- "--check-$check"
          done

  ai:
    name: FastAPI tests
    needs: plan
    if: needs.plan.outputs.test_ai == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            src/AiService
            src/Testing/AiService
            contracts
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/AiService/requirements*.txt
      - name: FastAPI tests
        working-directory: src/AiService
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

  web:
    name: Admin web type check
    needs: plan
    if: needs.plan.outputs.test_web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: src/Frontend
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Frontend/package-lock.json
      - name: Admin web type check
        working-directory: src/Frontend
        run: |
          npm ci
          npm run type-check

  validate:
    name: Validate .NET, FastAPI and admin web
    needs: [plan, backend, ai, web]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PLAN: ${{ needs.plan.result }}
      TEST_API: ${{ needs.plan.outputs.test_api }}
      TEST_AI: ${{ needs.plan.outputs.test_ai }}
      TEST_WEB: ${{ needs.plan.outputs.test_web }}
      API_RESULT: ${{ needs.backend.result }}
      AI_RESULT: ${{ needs.ai.result }}
      WEB_RESULT: ${{ needs.web.result }}
    steps:
      - name: Require every selected check to pass
        run: |
          set -euo pipefail
          [[ $PLAN == success ]]
          verify() {
            if [[ $1 == true ]]; then [[ $2 == success ]]; else [[ $1 == false && $2 == skipped ]]; fi
          }
          verify "$TEST_API" "$API_RESULT"
          verify "$TEST_AI" "$AI_RESULT"
          verify "$TEST_WEB" "$WEB_RESULT"

  native:
    name: Build Unity Linux Dedicated Server
    needs: plan
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.plan.outputs.release == 'true' && needs.plan.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # The Linux Editor cannot import the client-only H.264 artwork.
          sparse-checkout: |
            /*
            !/My project/Assets/FrontEndContent/Login/Playback/Login.mp4
            !/My project/Assets/FrontEndContent/Login/Playback/Login.mp4.meta
            !/My project/Assets/FrontEndContent/Loading/Artwork/Playback/PKV_*.mp4
            !/My project/Assets/FrontEndContent/Loading/Artwork/Playback/PKV_*.mp4.meta
          sparse-checkout-cone-mode: false
      - name: Verify license configuration and resolve exact Unity image
        id: editor
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          set -euo pipefail
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]] || [[ -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ]] || [[ -n "$UNITY_LICENSE" && -n "$UNITY_SERIAL" ]]; then
            echo 'Configure UNITY_EMAIL, UNITY_PASSWORD and exactly one of UNITY_LICENSE or UNITY_SERIAL.' >&2
            exit 1
          fi
          version=$(sed -n 's/^m_EditorVersion: \([^[:space:]]*\).*/\1/p' 'My project/ProjectSettings/ProjectVersion.txt')
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+[abfp][0-9]+$ ]]
          tag="unityci/editor:ubuntu-$version-linux-il2cpp-3.2.2"
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | jq -er 'select(test("^sha256:[0-9a-f]{64}$"))')
          printf 'image=unityci/editor@%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Build native Dedicated payload
        # v5.0.1 supports the shared memory size required by this Unity build.
        uses: game-ci/unity-builder@adaf7cd8f42fd48fbbf2d4f5f67ca30d87f819f1 # v5.0.1
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: My project
          unityVersion: auto
          targetPlatform: StandaloneLinux64
          customImage: ${{ steps.editor.outputs.image }}
          buildMethod: PickleVerse.EditorTools.DedicatedServerCiBuild.BuildFromCi
          buildName: PickleVerseServer
          buildsPath: artifacts/ci/unity
          customParameters: -pkvCommit ${{ github.sha }} -standaloneBuildSubtarget Server
          dockerShmSize: 8g
          versioning: None
      - name: Verify and package the native output
        run: |
          set -euo pipefail
          mapfile -t outputs < <(find artifacts/ci/unity -type f -name build-info.json)
          [[ ${#outputs[@]} -eq 1 ]]
          native=$(dirname "${outputs[0]}")
          python3 deploy/ci/verify-native.py "$native" "$GITHUB_SHA"
          tar --exclude='*_BackUpThisFolder_ButDontShipItWithYourGame' -czf "$RUNNER_TEMP/native.tar.gz" -C "$native" .
          (cd "$RUNNER_TEMP" && sha256sum native.tar.gz > native.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native.tar.gz
            ${{ runner.temp }}/native.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  publish:
    name: Publish changed images and smoke test the release
    needs: [plan, validate, native]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
          needs.plan.outputs.release == 'true' && needs.validate.result == 'success' &&
          ((needs.plan.outputs.native == 'true' && needs.native.result == 'success') ||
           (needs.plan.outputs.native == 'false' && needs.native.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      release: ${{ steps.release.outputs.release }}
      manifest: ${{ steps.release.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            deploy
            src
            My project/ProjectSettings
            My project/Assets/Scripts/Multiplayer/Services
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.native == 'true'
        with:
          name: native-${{ github.sha }}
          path: ${{ runner.temp }}/pkv-native
      - name: Verify and extract native artifact
        if: needs.plan.outputs.native == 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci/dedicatedserver
          (cd "$RUNNER_TEMP/pkv-native" && sha256sum --check native.sha256)
          tar -xzf "$RUNNER_TEMP/pkv-native/native.tar.gz" -C artifacts/ci/dedicatedserver
          python3 deploy/ci/verify-native.py artifacts/ci/dedicatedserver "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: needs.plan.outputs.build != ''
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build, push and smoke test the release
        id: release
        env:
          PKV_BUILD_COMPONENTS: ${{ needs.plan.outputs.build }}
          PKV_BASE_IMAGES: ${{ needs.plan.outputs.images }}
          PKV_PROTOCOL: ${{ needs.plan.outputs.protocol }}
        run: bash deploy/ci/publish-release.sh

  deploy:
    name: Deploy Linux development
    needs: [deployed, publish]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: development
    concurrency:
      group: pickleverse-linux-development
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /deploy/ci/
            /docker-compose.linux.yml
            /src/Database.sql
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deployment-state
          path: ${{ runner.temp }}
      - name: Install SSH password transport
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends sshpass
      - name: Sync deployment files and run Compose over SSH
        env:
          GH_TOKEN: ${{ github.token }}
          PKV_RELEASE: ${{ needs.publish.outputs.release }}
          PKV_RELEASE_MANIFEST: ${{ needs.publish.outputs.manifest }}
          PKV_DEPLOY_ROOT: ${{ vars.PKV_DEPLOY_ROOT || vars.PKV_DATA_ROOT }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER || 'min' }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          PKV_STATE_TOKEN=$(jq -er '.token' "$RUNNER_TEMP/deployment-state.json")
          export PKV_STATE_TOKEN
          bash deploy/ci/ssh-deploy.sh
