name: Build and publish Docker Hub images

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      server_release:
        description: 'Published native release tag (e.g. server-build-<commit>)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: tadminm/pickelverse

jobs:
  # 1. Build and push API, AI, and Web
  services:
    name: Build & Push ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: src/Backend/API/Dockerfile
          - component: ai
            dockerfile: src/AiService/Dockerfile
          - component: web
            dockerfile: src/Frontend/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove developer credentials from API settings
        if: matrix.component == 'api'
        run: |
          python3 deploy/api/sanitize_settings.py src/Backend/API "$RUNNER_TEMP/pkv-settings"
          cp "$RUNNER_TEMP/pkv-settings"/appsettings*.json src/Backend/API/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: tadminm
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ matrix.component }}-latest
            ${{ env.DOCKER_IMAGE }}:${{ matrix.component }}
            ${{ env.DOCKER_IMAGE }}:${{ matrix.component }}-${{ github.sha }}
          cache-from: type=gha,scope=publish-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.component }}

  # 2. Build and push Dedicated Server (when a release is published or server_release is specified)
  dedicated:
    name: Build & Push Dedicated Server
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.server_release != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: tadminm
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download and unpack server binary from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name || inputs.server_release }}"
          echo "Downloading native server payload from release tag: $tag"
          mkdir -p "$RUNNER_TEMP/native" artifacts/ci/dedicatedserver
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/native" --pattern "PickleVerseServer-linux-*.tar.gz"
          tar -xzf "$RUNNER_TEMP/native"/PickleVerseServer-linux-*.tar.gz -C artifacts/ci/dedicatedserver
          echo "Server unpacked successfully into artifacts/ci/dedicatedserver"

      - name: Build and push Dedicated Server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/game-server/Dockerfile
          build-args: SERVER_BUILD_PATH=artifacts/ci/dedicatedserver
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:server-latest
            ${{ env.DOCKER_IMAGE }}:server
            ${{ env.DOCKER_IMAGE }}:server-${{ github.sha }}
          cache-from: type=gha,scope=publish-server
          cache-to: type=gha,mode=max,scope=publish-server
