# Docker Compose >= 2.24.4. Add to the existing development compose project.
services:
  backend-api:
    image: pickleverse-api:${PKV_RELEASE:-20261103-p18}
    environment:
      DedicatedServer__Enabled: "${PKV_DEDICATED_ENABLED:-false}"
      DedicatedServer__ServiceKey: "${PKV_GAME_SERVER_KEY:-}"
      DedicatedServer__Protocol: "18"
      DedicatedServer__LeaseSeconds: "45"
    ports: !override
      - "${PKV_API_BIND:-0.0.0.0}:${API_PORT:-8080}:8080"
  ai-service:
    image: pickleverse-ai:${PKV_RELEASE:-20261103-p18}
  game-server:
    container_name: pickleverse_game_server
    image: pickleverse-game-server:${PKV_RELEASE:-20261103-p18}
    build:
      context: .
      dockerfile: deploy/game-server/Dockerfile
    profiles: [dedicated]
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    cpus: "${PKV_GAME_CPUS:-2}"
    mem_limit: "${PKV_GAME_MEMORY:-2g}"
    environment:
      PKV_BACKEND_URL: "http://backend-api:8080"
      PKV_GAME_SERVER_KEY: "${PKV_GAME_SERVER_KEY:-}"
      PKV_GAME_PORT: "3669"
    ports:
      - "3669:3669/udp"
    volumes:
      - game_server_data:/home/unity/.config/unity3d
    depends_on:
      backend-api:
        condition: service_started
    networks: [pickleverse_network]
volumes:
  game_server_data:
    name: pickleverse_dev_game_server_data
