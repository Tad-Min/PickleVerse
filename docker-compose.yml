services:
  # 1. Cơ sở dữ liệu PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: pickleverse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: "12345"
      POSTGRES_DB: pickleverse
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./src/Database.sql
        target: /docker-entrypoint-initdb.d/01_init.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d pickleverse"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - pickleverse_network

  # 2. Giao diện Quản trị CSDL (pgAdmin 4)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pickleverse_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pickleverse.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-15050}:80"
    depends_on:
      - postgres
    networks:
      - pickleverse_network

  # 3. Lưu trữ Object Storage S3 (Replays, Avatars, Videos)
  s3-storage:
    image: ghcr.io/shyim/local-s3:latest
    container_name: pickleverse_s3
    restart: unless-stopped
    environment:
      S3_ACCOUNT_ADMIN: "minioadmin:minioadmin"
    ports:
      - "127.0.0.1:${S3_PORT:-19000}:9000"
    volumes:
      - s3_data:/data
    networks:
      - pickleverse_network

  # 4. Backend Web API (.NET 10)
  backend-api:
    build:
      context: .
      dockerfile: src/Backend/API/Dockerfile
    container_name: pickleverse_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=pickleverse;Username=sa;Password=12345;"
      Storage__ServiceUrl: "http://s3-storage:9000"
      Storage__AccessKey: "minioadmin"
      Storage__SecretKey: "minioadmin"
      Storage__BucketName: "pickleverse"
      Storage__ForcePathStyle: "true"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in the ignored .env file}"
      Jwt__Issuer: "PickleVerseAPI"
      Jwt__Audience: "PickleVerseClient"
      Smtp__Host: "smtp.gmail.com"
      Smtp__Port: "587"
      Smtp__Username: "${SMTP_USERNAME:-}"
      Smtp__Password: "${SMTP_APP_PASSWORD:-}"
      Smtp__FromEmail: "${SMTP_FROM_EMAIL:-}"
      Smtp__FromName: "PickleVerse"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      s3-storage:
        condition: service_started
    networks:
      - pickleverse_network

volumes:
  postgres_data:
    driver: local
  s3_data:
    name: pickleverse_dev_s3_data
    driver: local

networks:
  pickleverse_network:
    driver: bridge
