services:
  # 1. Cơ sở dữ liệu PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: pickleverse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pickleverse
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./src/Database.sql
        target: /docker-entrypoint-initdb.d/01_init.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d pickleverse"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - pickleverse_network

  # 2. Giao diện Quản trị CSDL (pgAdmin 4)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pickleverse_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pickleverse.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-15050}:80"
    depends_on:
      - postgres
    networks:
      - pickleverse_network

  # 3. Lưu trữ Object Storage S3 (Replays, Avatars, Videos)
  s3-storage:
    image: ghcr.io/shyim/local-s3:latest
    container_name: pickleverse_s3
    restart: unless-stopped
    environment:
      S3_ACCOUNT_ADMIN: "${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}:${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}"
    ports:
      - "127.0.0.1:${S3_PORT:-19000}:9000"
    volumes:
      - s3_data:/data
    networks:
      - pickleverse_network

  # Redis owns transient queues/consent; PostgreSQL remains the durable game database.
  redis:
    image: redis:7.4-alpine
    container_name: pickleverse_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - pickleverse_network

  # Internal stateless analytics. Unity only calls backend-api.
  ai-service:
    build:
      context: .
      dockerfile: src/AiService/Dockerfile
    restart: unless-stopped
    environment:
      AI_SERVICE_KEY: "${AI_SERVICE_KEY:-}"
      AI_ENABLE_MODEL: "${AI_ENABLE_MODEL:-false}"
      AI_MODEL_PATH: "/models/tier.joblib"
      AI_COACHING_CALIBRATION_PATH: "/models/coaching.json"
      AI_COACHING_CALIBRATION_SHA256: "${AI_COACHING_CALIBRATION_SHA256:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 15s
      timeout: 3s
      retries: 3
    volumes:
      - ./src/AiService/models:/models:ro
    networks:
      - pickleverse_network

  # 4. Backend Web API (.NET 10)
  backend-api:
    build:
      context: .
      dockerfile: src/Backend/API/Dockerfile
    container_name: pickleverse_api
    restart: unless-stopped
    environment:
      HybridAi__IngestEnabled: "${AI_INGEST_ENABLED:-false}"
      HybridAi__DispatcherEnabled: "${AI_DISPATCHER_ENABLED:-false}"
      HybridAi__CoachingEnabled: "${AI_COACHING_ENABLED:-false}"
      HybridAi__ModelEnabled: "${AI_ENABLE_MODEL:-false}"
      HybridAi__ServiceUrl: "http://ai-service:8000"
      HybridAi__ServiceKey: "${AI_SERVICE_KEY:-}"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: 'Host=postgres;Port=5432;Database=pickleverse;Username=sa;Password="${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}";GSS Encryption Mode=Disable;Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-40};'
      Redis__ConnectionString: "redis:6379,abortConnect=false,connectTimeout=3000,syncTimeout=3000"
      Storage__ServiceUrl: "http://s3-storage:9000"
      Storage__AccessKey: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      Storage__SecretKey: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      Storage__BucketName: "pickleverse"
      Storage__ForcePathStyle: "true"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in the ignored .env file}"
      Jwt__Issuer: "PickleVerseAPI"
      Jwt__Audience: "PickleVerseClient"
      Smtp__Username: "${SMTP_USERNAME:-}"
      Smtp__Password: "${SMTP_APP_PASSWORD:-}"
      Smtp__FromEmail: "${SMTP_FROM_EMAIL:-}"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      s3-storage:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - pickleverse_network

volumes:
  redis_data:
    driver: local
  postgres_data:
    name: ${POSTGRES_VOLUME:-pickleverse_dev_postgres_data}
    driver: local
  s3_data:
    name: pickleverse_dev_s3_data
    driver: local

networks:
  pickleverse_network:
    driver: bridge
